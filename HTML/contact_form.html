<html>
    <head>
        <title>Contact Form</title>
        <style>
        body {
            background-color: #f0f3f5;
        }

        form {
            width: 350px;
            margin: 80px auto;   
            padding: 20px;
            border: 1px solid; 
            border-radius: 8px;
            background-color: white;
            
        }

        input, textarea {
            width: 100%;          
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: rgb(42, 42, 209);
            color: white;
        }

        input[type="submit"]:hover {
            background-color: rgb(24, 196, 24);   
            cursor: pointer;
        }
    </style>
    </head>
    <body>
        <form>
            Enter Your Name:
            <input type="text" name="Name" required><br><br>
            Enter Your Email:
            <input type="email" name="email" required><br><br>
            Enter Your Mobile Number:
            <input type="tel" name="Phone" pattern="[0-9]{10}" required><br><br>
            Message:<br>
            <textarea name="message" rows="8" cols="40" required></textarea><br><br>
            <input type="submit" name="submit" value="submit">
        </form>  
    </body>
</html>
